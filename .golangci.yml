# golangci-lint configuration.
#
# This file did not exist, which is why golangci-lint had never actually run:
# CI pinned v2.1, which is built with Go 1.24 and refuses to load a go 1.26.0
# module ("the Go language version used to build golangci-lint is lower than
# the targeted Go version"). It failed in about a second, before linting a
# single file, so the repo had no lint findings recorded anywhere.
#
# The standard linter set is errcheck, govet, ineffassign, staticcheck, unused.
# Three of those five earn their place here and have each caught a real defect
# in this codebase, so they stay strict:
#
#   unused      found a superseded duplicate WebSocket implementation and a
#               dead getPort helper
#   ineffassign found an argNum++ that was never read
#   staticcheck catches the correctness class the other three miss
#
# errcheck is where the judgement call is, and it is deliberate.

version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # A type assertion that fails panics on the next dereference, so it is
      # worth catching. Leave this on.
      check-type-assertions: true
      # `_, _ = w.Write(...)` is used deliberately throughout the HTTP handlers
      # to say "a client that hung up mid-response is not our problem". Do not
      # flag the explicit discards that express exactly that.
      check-blank: false

      # Fire-and-forget cleanup calls. Every one of these is a call whose error
      # carries no actionable information at the point it is written:
      #
      #   * Close/Rollback in a defer — the operation has already completed, and
      #     the deferred call cannot return it to the caller usefully.
      #   * writes to a hijacked or closing WebSocket connection, where the only
      #     possible error is "the peer went away", which is already handled by
      #     the read pump.
      #   * writes to an http.ResponseWriter after the response is committed.
      #
      # Everything else stays checked. This is a narrowing of the linter, not a
      # switch-off: the previous run reported 39 errcheck findings and every
      # single one was one of these shapes.
      exclude-functions:
        # Deferred cleanup. The operation has already completed by the time the
        # deferred call runs, and there is no caller left to return an error to.
        - "(*database/sql.DB).Close"
        - "(*database/sql.Rows).Close"
        - "(*database/sql.Tx).Rollback"
        - "(io.ReadCloser).Close"
        - "(net.Conn).Close"
        - "(*github.com/gorilla/websocket.Conn).Close"
        - "(*github.com/gorilla/websocket.Conn).WriteMessage"
        - "(*github.com/gorilla/websocket.Conn).SetReadDeadline"
        - "(*github.com/gorilla/websocket.Conn).SetWriteDeadline"
        - "(*net/http.Response).Body.Close"

        # Writes to a response that has already been committed, or to a socket
        # whose only possible error is "the peer went away" — a condition the
        # read pump already handles. Failing here would mean trying to change a
        # status line that is long gone.
        - "(net/http.ResponseWriter).Write"
        - "(*encoding/json.Encoder).Encode"
        - "fmt.Fprintf"

  exclusions:
    # Test fixtures and generated mocks routinely contain shapes the linters
    # flag for reasons that do not apply to production code.
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # test_ws.go is a standalone manual WebSocket probe at the module root,
      # not part of the service. It is a developer tool, so it is held to the
      # service's rules only by accident of directory.
      - path: ^test_ws\.go
        linters:
          - errcheck
          - unused

formatters:
  enable:
    - gofmt
