name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: go test (ubuntu)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mcp_tracker
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        env:
          DATABASE_URL: postgres://mcp:secret@localhost:5432/mcp_tracker?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: unit tests with race detector
        run: go test -race -count=1 ./...

      - name: apply migrations
        if: always()
        run: go run ./cmd/migrate -cmd up

      - name: integration tests
        if: always()
        run: go test -tags=integration -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          args: --timeout=5m
