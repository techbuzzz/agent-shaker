name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref — saves CI minutes on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- Go backend
  backend:
    name: go (build, vet, fmt, race)
    runs-on: ubuntu-latest

    # Service containers are declared at JOB level, never at step level. A
    # step-level `services:` key is not in the workflow schema: GitHub rejects
    # the entire file with "Unexpected value 'services'" and the run fails
    # instantly with zero jobs. That is exactly what happened here — this
    # workflow had been invalid since it was written, so 21 runs produced 0
    # successes and not one step ever executed, while every local check passed
    # and the badge sat red.
    #
    # One postgres serves both database-backed steps. They deliberately share
    # an instance, and the migration step runs FIRST so its emptiness assertion
    # sees a virgin database and the integration tests run against a schema that
    # already exists.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mcp_tracker
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp -d mcp_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        # .gitattributes pins text files to LF, so this is stable across
        # runner platforms. Runs against ./cmd and ./internal only so that
      # generated or vendored trees cannot break the gate.
        run: |
          out=$(gofmt -l ./cmd ./internal ./tests)
          if [ -n "$out" ]; then
            echo "::error::Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: unit tests (race detector)
        run: go test -race -count=1 ./...

      - name: migrations apply cleanly and leave an empty database
        # Proves the migration chain is internally consistent: every file
        # applies in order against an empty database, and `up` is idempotent.
        #
        # It then asserts the database is EMPTY afterwards. That is a separate
        # property and it was silently violated for the life of the project:
        # 002_sample_data seeded 3 projects, 9 agents, 9 tasks and 4 contexts
        # into every database, so a fresh production deployment came up with
        # demo rows the UI rendered exactly like real work. Migrations that
        # apply cleanly and migrations that seed data are not the same gate, so
        # this one is asserted rather than assumed.
        #
        # Runs before the integration tests so the assertion sees a virgin
        # database and those tests run against a schema that already exists.
        run: |
          go run ./cmd/migrate -cmd version || true
          go run ./cmd/migrate -cmd up
          go run ./cmd/migrate -cmd up   # second run must be a no-change

          pg=$(docker ps --filter ancestor=postgres:16-alpine --format '{{.Names}}' | head -1)
          [ -n "$pg" ] || { echo "::error::could not find the postgres service container"; exit 1; }

          rows=$(docker exec "$pg" psql -U mcp -d mcp_tracker -tAc \
            "SELECT (SELECT count(*) FROM projects)
                  + (SELECT count(*) FROM agents)
                  + (SELECT count(*) FROM tasks)
                  + (SELECT count(*) FROM contexts);")
          if [ "$rows" != "0" ]; then
            echo "::error::a fresh database is not empty: $rows row(s) across projects/agents/tasks/contexts"
            echo "::error::some migration is seeding data again. Demo data belongs in scripts/seed_demo_data.sql"
            exit 1
          fi
          echo "fresh database is empty across all four tables"
        env:
          DATABASE_URL: postgres://mcp:secret@localhost:5432/mcp_tracker?sslmode=disable

      # Every currently-tagged integration test needs a live database. The tag
      # is applied to a package-scoped run so a future -tags=integration file
      # is picked up without this job silently testing nothing. No such file
      # exists yet, so today this re-runs the ordinary tests against a migrated
      # schema — harmless, and it becomes meaningful the moment one is added.
      - name: integration tests (postgres)
        run: go test -tags=integration -count=1 ./...
        env:
          DATABASE_URL: postgres://mcp:secret@localhost:5432/mcp_tracker?sslmode=disable

  # ------------------------------------------------------------ shell scripts
  #
  # scripts/deploy.sh is the production bootstrap: it resolves secrets, brings
  # up the stack and is the last thing standing between an operator and a
  # half-configured deployment. Nothing else in this workflow executes it, so a
  # regression in it would not be caught anywhere.
  scripts:
    name: shell scripts (parse + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: every tracked script parses
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no shell scripts found — the glob is wrong, not the repo"
            exit 1
          fi
          echo "checking: ${scripts[*]}"
          for s in "${scripts[@]}"; do
            if ! bash -n "$s"; then
              echo "::error::$s does not parse"
              exit 1
            fi
          done

      - name: shellcheck (warning and above)
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck -S warning "${scripts[@]}"

      - name: deploy.sh refuses to run without a real host
        # Guards the one precondition that cannot be checked by reading the
        # script: ACME will not issue a certificate for localhost, so a deploy
        # pointed at it fails after the whole stack is already built.
        run: |
          set -euo pipefail
          if bash scripts/deploy.sh >/dev/null 2>&1; then
            echo "::error::deploy.sh exited 0 with no --host"
            exit 1
          fi
          if bash scripts/deploy.sh --host localhost >/dev/null 2>&1; then
            echo "::error::deploy.sh accepted --host localhost"
            exit 1
          fi
          bash scripts/deploy.sh --help >/dev/null

  # ------------------------------------------------------------------- linting
  lint:
    name: golangci-lint + workflow schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs first, before anything else in this job. actionlint validates
      # against GitHub's own workflow schema, which a YAML parser does not:
      # this file carried step-level `services:` keys, which parse cleanly and
      # which GitHub rejects with "Invalid workflow file". The consequence was
      # invisible locally — every check passed — while 21 runs produced 0
      # successes and not one step ever executed.
      #
      # A check that lives inside a workflow cannot catch a workflow that does
      # not dispatch, which is exactly why this needs to be a step AND a local
      # target (`make workflow-lint`).
      - name: workflow schema (actionlint)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The linter must be built with a Go at least as new as the module's `go`
      # directive, or it refuses to load anything:
      #
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.26.0)
      #
      # v2.1 hit this — it is built with Go 1.24 against a go 1.26.0 module — and
      # failed in about a second, before linting a single file. So the major
      # version alone is not the constraint; the build Go is. When Go moves
      # again, bump this to the first release built with Go >= the new directive.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          args: --timeout=10m

  # --------------------------------------------------------- Nuxt 4 frontend
  frontend:
    name: nuxt (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        # `ci` not `install`: it honours the lockfile exactly and fails if
        # package.json and package-lock.json have drifted apart.
        run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: unit tests
        # The MCP setup generator is the one place where a regression would
        # write a credential into a file that gets committed to a customer's
        # repository, so it is asserted directly rather than left to review.
        run: npm test

      - name: build
        run: npm run build

      - name: verify Nitro proxy routes were emitted
        # The production topology depends on server/routes/api/[...path].ts
        # existing. A mis-scoped directory in nuxt.config would silently drop
        # it from the bundle and only fail at runtime, so assert on the output.
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs || { echo "::error::no Nitro server bundle"; exit 1; }

          # Glob rather than `ls | grep`: filenames here are generated, so a
          # fixed path would be a guess, and piping ls breaks on odd characters.
          shopt -s nullglob
          ws_routes=(.output/server/chunks/routes/*ws*)
          if [ "${#ws_routes[@]}" -eq 0 ]; then
            echo "::error::WS proxy route missing from bundle"
            exit 1
          fi
          api_routes=(.output/server/chunks/routes/api/*)
          if [ "${#api_routes[@]}" -eq 0 ]; then
            echo "::error::API proxy route missing from bundle"
            exit 1
          fi
          echo "proxy routes present: ${ws_routes[*]} ${api_routes[*]}"

  # -------------------------------------------------- container build sanity
  containers:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: build Go image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agent-shaker-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build Nuxt image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: agent-shaker-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both profiles are validated, not just the default one. The `tls` profile
      # adds the Caddy edge, and a broken Caddyfile only fails at container
      # start — long after merge — so it gets its own gate here.
      #
      # The bcrypt hash is generated in-runner. It is a throwaway for a config
      # parse, never a deployed credential, and it must NOT be read from a repo
      # env file: compose interpolates `$VAR` inside those, which silently eats
      # the `$<salt>` segment of a real hash (see docs/DEPLOYMENT.md).
      - name: compose config is valid (default profile)
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          API_KEYS: ci-only-not-a-secret

      - name: compose config is valid (tls profile)
        # This step only proves compose interpolation resolves for the tls
        # profile — it is not a credential and is deliberately not shaped like
        # one, so secret scanners do not flag this file. The Caddyfile is
        # validated for real, with a freshly generated hash, in the next step.
        run: docker compose --profile tls config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          API_KEYS: ci-only-not-a-secret
          BASIC_AUTH_USER: ci
          BASIC_AUTH_HASH: ci-only-not-a-hash

      - name: caddyfile is valid and formatted
        # `caddy fmt --diff` prints a diff and EXITS 1 when the file needs
        # changes, 0 when it is already canonical. Exit code is the signal — the
        # diff rendering is not stable enough to parse, and set -e fails the
        # step for us.
        #
        # The hash is generated in-runner: it is a throwaway for a config parse,
        # never a deployed credential, and it must NOT come from a repo env file
        # (compose interpolates $VAR inside those and would eat the salt — see
        # docs/DEPLOYMENT.md). It is exported rather than interpolated, which is
        # the form that survives.
        run: |
          export BASIC_AUTH_USER=ci
          # Assign then export, rather than `export X="$(...)"`: the latter masks
          # the command's exit status, so a failed hash generation would export an
          # empty value and the gate below would validate a Caddyfile configured
          # with no credential at all — passing for the wrong reason.
          BASIC_AUTH_HASH="$(docker run --rm caddy:2-alpine caddy hash-password --plaintext 'ci-only')"
          export BASIC_AUTH_HASH
          [ -n "$BASIC_AUTH_HASH" ] || { echo "::error::bcrypt hash generation produced nothing"; exit 1; }
          export PUBLIC_HOST=localhost

          # The -v flag is written out on each command rather than held in a
          # shell variable: path-bearing arguments stored in variables get
          # rewritten by some shells' argument-conversion layers, and this gate
          # must not be sensitive to that.
          docker run --rm -e BASIC_AUTH_USER -e BASIC_AUTH_HASH -e PUBLIC_HOST \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy fmt --diff /etc/caddy/Caddyfile > /dev/null

          docker run --rm -e BASIC_AUTH_USER -e BASIC_AUTH_HASH -e PUBLIC_HOST \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
