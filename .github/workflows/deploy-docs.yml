name: Deploy Docs Site to GitHub Pages

on:
  # Run when docs-site changes or when this workflow changes
  push:
    branches: [main, master]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
      - 'docs/**'        # Rebuild when documentation markdown changes
      - 'images/use-cases/**'  # Rebuild when screenshots change
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancelling any in-progress runs
concurrency:
  group: 'docs-pages'
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ------------------------------------------------------------------ build
  build:
    name: Build docs static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        # Next.js static export produces the `out/` directory.
        # basePath '/agent-shaker' is configured in next.config.js.
        run: npm run build

      - name: Verify exported links
        # Fails the build if any internal href/src is missing basePath,
        # double-prefixed, or points at a file the export did not produce.
        run: npm run check:links

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The static files generated by `next build` (output: 'export')
          path: docs-site/out

  # ---------------------------------------------------------------- deploy
  deploy:
    name: Deploy docs to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-docs
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
